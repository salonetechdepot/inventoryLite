<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockEasy - Offline</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f5f5f5;
      }
      .card {
        max-width: 480px;
        margin: 24px;
        padding: 24px;
        border-radius: 12px;
        background: #171717;
        border: 1px solid #262626;
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
      }
      p {
        line-height: 1.5;
        color: #d4d4d4;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        StockEasy is currently offline. You can continue working with cached data and queued
        changes.
      </p>
      <p>
        Once your connection returns, queued actions will sync automatically.
      </p>
    </main>
  </body>
</html>
